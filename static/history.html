<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#29992;&#25143;&#21382;&#21490;&#31579;&#36873;&#19982;&#25972;&#29702;</title>
  <style>
    :root { --bg:#f6f8fc; --paper:rgba(255,255,255,.94); --line:rgba(203,213,225,.78); --text:#0f172a; --muted:#64748b; --accent:#2563eb; --accent-strong:#1d4ed8; --accent-soft:rgba(37,99,235,.08); --shadow:0 18px 60px rgba(15,23,42,.08); --ok:#197149; --warn:#9a6a17; --bad:#af3a31; }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:radial-gradient(circle at top left, rgba(59,130,246,.12), transparent 22%), linear-gradient(180deg, #f6f8fc, #f8fbff)}
    .page{max-width:1480px;margin:0 auto;padding:24px 18px 40px}.hero,.panel,.record{border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow);backdrop-filter:blur(10px)}
    .hero{border-radius:30px;padding:28px;background:radial-gradient(circle at 84% 18%, rgba(59,130,246,.09), transparent 24%), linear-gradient(180deg, rgba(255,255,255,.98), rgba(248,250,255,.94))}
    .hero-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.tag{display:inline-flex;align-items:center;padding:8px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);font-size:13px;font-weight:700}h1,h2,p{margin:0}.hero-desc{margin-top:14px;color:var(--muted);line-height:1.9;font-size:15px;max-width:980px}
    .hero-actions{display:flex;gap:12px;flex-wrap:wrap}.btn,.link-btn,.ghost-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:16px;border:1px solid transparent;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}.btn{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-strong));box-shadow:0 14px 30px rgba(37,99,235,.22)}.link-btn,.ghost-btn{color:var(--accent-strong);background:rgba(255,255,255,.86);border-color:rgba(203,213,225,.78)}
    .banner{margin-top:18px;padding:15px 18px;border-radius:18px;border:1px solid rgba(203,213,225,.78);background:rgba(255,255,255,.78);color:var(--muted);line-height:1.8}
    .main-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px;margin-top:18px}.panel{border-radius:26px;padding:22px;background:linear-gradient(180deg,#fff, rgba(248,250,255,.94))}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}.panel-head p{margin-top:8px;color:var(--muted);line-height:1.7;font-size:14px}
    .side-stack,.result-stack{display:flex;flex-direction:column;gap:18px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat-card{padding:16px;border-radius:18px;border:1px solid rgba(203,213,225,.72);background:rgba(255,255,255,.78)}.stat-card small{display:block;color:var(--muted);margin-bottom:8px}.stat-card strong{font-size:24px}
    .kv-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}.kv-item{display:flex;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px dashed rgba(203,213,225,.78);font-size:14px;color:var(--muted)}.kv-item:last-child{border-bottom:none;padding-bottom:0}.kv-item span:last-child{color:var(--text);font-weight:700;text-align:right;word-break:break-word}
    .status-box{padding:16px;border-radius:18px;border:1px solid rgba(203,213,225,.72);background:rgba(255,255,255,.78)} .label{display:block;margin-bottom:8px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}.mono{font-family:Consolas,"Courier New",monospace;white-space:pre-wrap;word-break:break-word;line-height:1.7;font-size:13px}
    .filter-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-top:4px}.field{display:flex;flex-direction:column;gap:8px}.field label{color:var(--muted);font-size:13px;font-weight:700}.field.wide{grid-column:span 2}
    select,input{width:100%;min-height:46px;padding:0 14px;border-radius:14px;border:1px solid rgba(203,213,225,.78);background:rgba(255,255,255,.88);color:var(--text);font:inherit}.toolbar,.toolbar-left,.toolbar-right,.summary-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar{justify-content:space-between;margin-top:16px}.summary-bar{margin-top:18px}.summary-pill{display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid rgba(203,213,225,.72);color:var(--muted);font-size:13px}.summary-pill strong{margin-left:8px;color:var(--text)}
    .record{border-radius:22px;padding:18px;background:rgba(255,255,255,.82)}.record-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.meta-group{display:flex;gap:10px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);font-size:12px;font-weight:700}.record-order{color:var(--muted);font-size:13px;font-weight:700}.content-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.content-card{padding:15px;border-radius:18px;border:1px solid rgba(203,213,225,.72);background:rgba(255,255,255,.78)}.content-card p{margin-top:8px;color:var(--text);line-height:1.8;white-space:pre-wrap;word-break:break-word;font-size:14px}.empty{padding:24px;border-radius:20px;border:1px dashed rgba(37,99,235,.22);background:rgba(255,255,255,.66);text-align:center;color:var(--muted);line-height:1.8}.status-ok{color:var(--ok)}.status-warn{color:var(--warn)}.status-bad{color:var(--bad)}
    @media (max-width:1220px){.main-grid{grid-template-columns:1fr}.filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.field.wide{grid-column:span 2}} @media (max-width:760px){.page{padding:14px 12px 28px}.hero-top,.toolbar,.content-grid{display:block}.hero-actions,.toolbar-left,.toolbar-right{margin-top:14px}.filter-grid{grid-template-columns:1fr}.field.wide{grid-column:span 1}.stats{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <div class="hero-top">
        <div>
          <div id="tag" class="tag"></div>
          <h1 id="heroTitle"></h1>
          <p id="heroDesc" class="hero-desc"></p>
        </div>
        <div class="hero-actions">
          <a id="backLink" class="link-btn" href="/"></a>
          <button id="refreshBtn" class="btn" type="button"></button>
        </div>
      </div>
      <div id="banner" class="banner"></div>
    </section>
    <section class="main-grid">
      <aside class="side-stack">
        <article class="panel">
          <div class="panel-head"><div><h2 id="statusTitle"></h2><p id="statusDesc"></p></div></div>
          <div class="stats"><div class="stat-card"><small id="dbLabel"></small><strong id="dbExistsText">--</strong></div><div class="stat-card"><small id="moduleLabel"></small><strong id="moduleExistsText">--</strong></div></div>
          <div class="kv-list"><div class="kv-item"><span id="dbPathLabel"></span><span id="dbPathText">--</span></div><div class="kv-item"><span id="modulePathLabel"></span><span id="modulePathText">--</span></div><div class="kv-item"><span id="tableLabel"></span><span id="tableExistsText">--</span></div><div class="kv-item"><span id="countLabel"></span><span id="recordCountText">--</span></div></div>
        </article>
        <article class="panel">
          <div class="panel-head"><div><h2 id="stateTitle"></h2><p id="stateDesc"></p></div><button id="refreshStateBtn" class="ghost-btn" type="button"></button></div>
          <div class="status-box"><span id="emotionLabel" class="label"></span><div id="emotionBox" class="mono">--</div></div>
          <div class="status-box" style="margin-top:12px;"><span id="historyLabel" class="label"></span><div id="historyBox" class="mono">--</div></div>
        </article>
      </aside>
      <section class="result-stack">
        <article class="panel">
          <div class="panel-head"><div><h2 id="filterTitle"></h2><p id="filterDesc"></p></div></div>
          <div class="filter-grid">
            <div class="field"><label id="characterFilterLabel" for="characterSelect"></label><select id="characterSelect"><option value=""></option></select></div>
            <div class="field"><label id="modeFilterLabel" for="modeSelect"></label><select id="modeSelect"><option value=""></option></select></div>
            <div class="field"><label id="sessionFilterLabel" for="sessionSelect"></label><select id="sessionSelect"><option value=""></option></select></div>
            <div class="field"><label id="viewLabel" for="viewSelect"></label><select id="viewSelect"><option value="all"></option><option value="mine"></option><option value="ai"></option></select></div>
            <div class="field wide"><label id="searchLabel" for="searchInput"></label><input id="searchInput" type="text"></div>
            <div class="field"><label id="limitLabel" for="limitInput"></label><input id="limitInput" type="number" min="10" max="500" value="100"></div>
          </div>
          <div class="toolbar"><div class="toolbar-left"><button id="applyBtn" class="btn" type="button"></button><button id="resetBtn" class="ghost-btn" type="button"></button></div><div class="toolbar-right"><button id="exportBtn" class="link-btn" type="button"></button></div></div>
          <div class="summary-bar"><div class="summary-pill"><span id="countSummaryLabel"></span><strong id="countText">0</strong></div><div class="summary-pill"><span id="viewSummaryLabel"></span><strong id="viewText"></strong></div><div class="summary-pill"><span id="modeSummaryLabel"></span><strong id="modeText"></strong></div></div>
        </article>
        <article class="panel"><div class="panel-head"><div><h2 id="resultTitle"></h2><p id="resultDesc"></p></div></div><div id="resultList" class="result-stack"></div></article>
      </section>
    </section>
  </div>
  <script>
    const T = {
      pageTitle:'\u7528\u6237\u5386\u53f2\u7b5b\u9009\u4e0e\u6574\u7406', tag:'\u7b2c\u4e09\u9636\u6bb5 - \u5386\u53f2\u8bb0\u5f55\u6a21\u5757', heroTitle:'\u7528\u6237\u5386\u53f2\u7b5b\u9009\u4e0e\u6574\u7406', heroDesc:'\u8fd9\u4e2a\u9875\u9762\u53ea\u8d1f\u8d23\u5386\u53f2\u8bb0\u5f55\u6a21\u5757\uff0c\u4e0d\u6539\u9996\u9875\u804a\u5929\u4e3b\u6d41\u7a0b\u3002\u4f60\u53ef\u4ee5\u6309\u89d2\u8272\u3001\u5bf9\u8bdd\u6a21\u5f0f\u3001\u4f1a\u8bdd\u548c\u67e5\u770b\u65b9\u5f0f\u7b5b\u9009\u5386\u53f2\u5185\u5bb9\uff0c\u4e5f\u53ef\u4ee5\u641c\u7d22\u804a\u5929\u6587\u672c\u5e76\u5bfc\u51fa\u5f53\u524d\u7ed3\u679c\u3002', back:'\u8fd4\u56de\u804a\u5929\u4e3b\u9875', refresh:'\u5237\u65b0\u5f53\u524d\u9875\u9762\u6570\u636e', statusTitle:'\u63a5\u5165\u60c5\u51b5', statusDesc:'\u8fd9\u91cc\u7528\u4e8e\u786e\u8ba4\u5f53\u524d\u9875\u9762\u662f\u5426\u5df2\u7ecf\u8fde\u5230\u4e3b\u7cfb\u7edf\u7684\u5386\u53f2\u6570\u636e\u5e93\u548c\u8bb0\u5fc6\u6a21\u5757\u3002', dbLabel:'\u6570\u636e\u5e93\u6587\u4ef6', moduleLabel:'\u8bb0\u5fc6\u6a21\u5757', dbPathLabel:'\u6570\u636e\u5e93\u8def\u5f84', modulePathLabel:'\u6a21\u5757\u8def\u5f84', tableLabel:'\u5386\u53f2\u8868\u72b6\u6001', countLabel:'\u8bb0\u5f55\u603b\u6570', stateTitle:'\u6700\u8fd1\u4e92\u52a8\u72b6\u6001', stateDesc:'\u8fd9\u91cc\u4fdd\u7559\u548c\u4e3b\u7cfb\u7edf\u8054\u52a8\u7684\u72b6\u6001\u4fe1\u606f\uff0c\u4f46\u7528\u7528\u6237\u80fd\u770b\u61c2\u7684\u8bdd\u6765\u5c55\u793a\u3002', refreshState:'\u5237\u65b0\u72b6\u6001', emotionLabel:'\u6700\u8fd1\u4e00\u6b21\u8bed\u6c14\u5224\u65ad', historyLabel:'\u7d2f\u8ba1\u4e92\u52a8\u503e\u5411', filterTitle:'\u7b5b\u9009\u6761\u4ef6', filterDesc:'\u91cd\u70b9\u4e0d\u662f\u67e5\u770b\u6574\u6bb5\u5b8c\u6574\u4f1a\u8bdd\uff0c\u800c\u662f\u628a\u5386\u53f2\u8bb0\u5f55\u6309\u89d2\u8272\u3001\u6a21\u5f0f\u3001\u4f1a\u8bdd\u548c\u53d1\u8a00\u65b9\u5f0f\u6574\u7406\u51fa\u6765\u3002', characterFilter:'\u89d2\u8272\u7b5b\u9009', allCharacters:'\u5168\u90e8\u89d2\u8272', modeFilter:'\u5bf9\u8bdd\u6a21\u5f0f', allModes:'\u5168\u90e8\u6a21\u5f0f', sessionFilter:'\u4f1a\u8bdd\u7b5b\u9009', allSessions:'\u5168\u90e8\u4f1a\u8bdd', viewLabel:'\u67e5\u770b\u65b9\u5f0f', viewAll:'\u5b8c\u6574\u5bf9\u8bdd', viewMine:'\u53ea\u770b\u6211\u7684\u53d1\u8a00', viewAi:'\u53ea\u770b AI \u56de\u590d', searchLabel:'\u641c\u7d22\u804a\u5929\u5185\u5bb9', searchPlaceholder:'\u53ea\u641c\u7d22\u7528\u6237\u548c AI \u53ef\u89c1\u7684\u804a\u5929\u5185\u5bb9', limitLabel:'\u663e\u793a\u6761\u6570', apply:'\u5e94\u7528\u7b5b\u9009', reset:'\u91cd\u7f6e\u7b5b\u9009', export:'\u5bfc\u51fa\u5f53\u524d\u7ed3\u679c', countSummary:'\u5f53\u524d\u7ed3\u679c\u6570\u91cf', viewSummary:'\u5f53\u524d\u67e5\u770b\u65b9\u5f0f', modeSummary:'\u5f53\u524d\u6a21\u5f0f', resultTitle:'\u7b5b\u9009\u7ed3\u679c', resultDesc:'\u6bcf\u6761\u8bb0\u5f55\u4f1a\u663e\u793a\u89d2\u8272\u540d\u3001\u5bf9\u8bdd\u6a21\u5f0f\u3001\u4f1a\u8bdd\u7f16\u53f7\uff0c\u4ee5\u53ca\u4f60\u5f53\u524d\u9009\u62e9\u7684\u53ef\u89c1\u53d1\u8a00\u5185\u5bb9\u3002', noRecords:'\u5f53\u524d\u7b5b\u9009\u6761\u4ef6\u4e0b\u6ca1\u6709\u627e\u5230\u5386\u53f2\u8bb0\u5f55\u3002', myMessage:'\u6211\u7684\u53d1\u8a00', aiMessage:'AI \u56de\u590d', rowPrefix:'\u7b2c ', rowSuffix:' \u6761\u8bb0\u5f55'};
    document.title=T.pageTitle;['tag','heroTitle','heroDesc','backLink','refreshBtn','statusTitle','statusDesc','dbLabel','moduleLabel','dbPathLabel','modulePathLabel','tableLabel','countLabel','stateTitle','stateDesc','refreshStateBtn','emotionLabel','historyLabel','filterTitle','filterDesc','characterFilterLabel','modeFilterLabel','sessionFilterLabel','viewLabel','searchLabel','limitLabel','applyBtn','resetBtn','exportBtn','countSummaryLabel','viewSummaryLabel','modeSummaryLabel','resultTitle','resultDesc'].forEach(id=>{const map={tag:T.tag,heroTitle:T.heroTitle,heroDesc:T.heroDesc,backLink:T.back,refreshBtn:T.refresh,statusTitle:T.statusTitle,statusDesc:T.statusDesc,dbLabel:T.dbLabel,moduleLabel:T.moduleLabel,dbPathLabel:T.dbPathLabel,modulePathLabel:T.modulePathLabel,tableLabel:T.tableLabel,countLabel:T.countLabel,stateTitle:T.stateTitle,stateDesc:T.stateDesc,refreshStateBtn:T.refreshState,emotionLabel:T.emotionLabel,historyLabel:T.historyLabel,filterTitle:T.filterTitle,filterDesc:T.filterDesc,characterFilterLabel:T.characterFilter,modeFilterLabel:T.modeFilter,sessionFilterLabel:T.sessionFilter,viewLabel:T.viewLabel,searchLabel:T.searchLabel,limitLabel:T.limitLabel,applyBtn:T.apply,resetBtn:T.reset,exportBtn:T.export,countSummaryLabel:T.countSummary,viewSummaryLabel:T.viewSummary,modeSummaryLabel:T.modeSummary,resultTitle:T.resultTitle,resultDesc:T.resultDesc}; document.getElementById(id).textContent=map[id];});
    document.querySelector('#characterSelect option').textContent=T.allCharacters; document.querySelector('#modeSelect option').textContent=T.allModes; document.querySelector('#sessionSelect option').textContent=T.allSessions; document.querySelector('#viewSelect option[value="all"]').textContent=T.viewAll; document.querySelector('#viewSelect option[value="mine"]').textContent=T.viewMine; document.querySelector('#viewSelect option[value="ai"]').textContent=T.viewAi; document.getElementById('searchInput').placeholder=T.searchPlaceholder;
    const banner=document.getElementById('banner'),dbExistsText=document.getElementById('dbExistsText'),moduleExistsText=document.getElementById('moduleExistsText'),dbPathText=document.getElementById('dbPathText'),modulePathText=document.getElementById('modulePathText'),tableExistsText=document.getElementById('tableExistsText'),recordCountText=document.getElementById('recordCountText'),emotionBox=document.getElementById('emotionBox'),historyBox=document.getElementById('historyBox'),characterSelect=document.getElementById('characterSelect'),modeSelect=document.getElementById('modeSelect'),sessionSelect=document.getElementById('sessionSelect'),viewSelect=document.getElementById('viewSelect'),searchInput=document.getElementById('searchInput'),limitInput=document.getElementById('limitInput'),refreshBtn=document.getElementById('refreshBtn'),refreshStateBtn=document.getElementById('refreshStateBtn'),applyBtn=document.getElementById('applyBtn'),resetBtn=document.getElementById('resetBtn'),exportBtn=document.getElementById('exportBtn'),countText=document.getElementById('countText'),viewText=document.getElementById('viewText'),modeText=document.getElementById('modeText'),resultList=document.getElementById('resultList');
    const viewNameMap={all:T.viewAll,mine:T.viewMine,ai:T.viewAi};
    function escapeHtml(text){return String(text??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
    async function fetchJson(url){const response=await fetch(url);const data=await response.json();if(!response.ok) throw new Error(data.detail||'\u8bf7\u6c42\u5931\u8d25');return data}
    function buildQuery(params){const search=new URLSearchParams();Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&String(v).trim()!=='') search.set(k,String(v))});return search.toString()}
    function getFilters(){return {character_id:characterSelect.value,mode:modeSelect.value,session_id:sessionSelect.value,keyword:searchInput.value.trim(),limit:Number(limitInput.value||'100')}}
    function fillSelect(select, items, placeholder){const current=select.value;select.innerHTML=`<option value="">${placeholder}</option>`;for(const item of items){const option=document.createElement('option');option.value=item.id;option.textContent=item.name;select.appendChild(option)} if([...select.options].some(option=>option.value===current)) select.value=current}
    async function loadStatus(){const data=await fetchJson('/api/memory/status');const repo=data.repository||{};dbExistsText.textContent=repo.db_exists?'\u5df2\u8fde\u63a5':'\u672a\u8fde\u63a5';moduleExistsText.textContent=data.module_exists?'\u5df2\u627e\u5230':'\u672a\u627e\u5230';dbPathText.textContent=repo.db_path||'--';modulePathText.textContent=data.module_path||'--';tableExistsText.textContent=repo.table_exists?'\u53ef\u8bfb\u53d6':'\u672a\u627e\u5230';recordCountText.textContent=String(repo.record_count??0);if(repo.db_exists&&repo.table_exists) banner.innerHTML='<span class="status-ok">\u5f53\u524d\u5df2\u7ecf\u8fde\u5230\u4e3b\u7cfb\u7edf\u5386\u53f2\u6570\u636e\u5e93\u3002\u4f60\u73b0\u5728\u7b5b\u9009\u548c\u5bfc\u51fa\u7684\u90fd\u662f\u4e3b\u7cfb\u7edf\u771f\u5b9e\u5199\u5165\u7684\u8bb0\u5f55\u3002</span>';else if(repo.db_exists) banner.innerHTML='<span class="status-warn">\u5df2\u7ecf\u627e\u5230\u6570\u636e\u5e93\u6587\u4ef6\uff0c\u4f46\u5386\u53f2\u8868\u6682\u65f6\u4e0d\u53ef\u7528\u3002</span>';else banner.innerHTML='<span class="status-bad">\u6682\u65f6\u6ca1\u6709\u627e\u5230\u4e3b\u7cfb\u7edf\u5386\u53f2\u6570\u636e\u5e93\u3002</span>'}
    async function loadState(){const data=await fetchJson('/api/memory/state');emotionBox.textContent=data.emotion||'\u5f53\u524d\u8fd8\u6ca1\u6709\u53ef\u5c55\u793a\u7684\u8bed\u6c14\u5224\u65ad\u6570\u636e';historyBox.textContent=data.history||'\u5f53\u524d\u8fd8\u6ca1\u6709\u53ef\u5c55\u793a\u7684\u7d2f\u8ba1\u4e92\u52a8\u72b6\u6001'}
    async function loadOptions(){const data=await fetchJson('/api/history/options');fillSelect(characterSelect,data.characters||[],T.allCharacters);fillSelect(modeSelect,data.modes||[],T.allModes);fillSelect(sessionSelect,data.sessions||[],T.allSessions)}
    function renderEmpty(text){resultList.innerHTML=`<div class="empty">${escapeHtml(text)}</div>`}
    function renderRecords(items){if(!items.length){renderEmpty(T.noRecords);return}const view=viewSelect.value;resultList.innerHTML=items.map((item,index)=>{const sections=[];if(view!=='ai') sections.push(`<div class="content-card"><span class="label">${T.myMessage}</span><p>${escapeHtml(item.submit||'')}</p></div>`);if(view!=='mine') sections.push(`<div class="content-card"><span class="label">${T.aiMessage}</span><p>${escapeHtml(item.reply||'')}</p></div>`);return `<article class="record"><div class="record-head"><div class="meta-group"><span class="pill">${escapeHtml(item.character_name||'')}</span><span class="pill">${escapeHtml(item.mode_name||'')}</span><span class="pill">${escapeHtml(item.session_name||'')}</span></div><div class="record-order">${T.rowPrefix}${items.length-index}${T.rowSuffix}</div></div><div class="content-grid">${sections.join('')}</div></article>`}).join('')}
    async function loadRecords(){const filters=getFilters();const query=buildQuery(filters);const data=await fetchJson(`/api/history/records?${query}`);const items=data.items||[];countText.textContent=String(data.total??items.length);viewText.textContent=viewNameMap[viewSelect.value]||T.viewAll;modeText.textContent=modeSelect.options[modeSelect.selectedIndex]?.text||T.allModes;renderRecords(items)}
    function resetFilters(){characterSelect.value='';modeSelect.value='';sessionSelect.value='';viewSelect.value='all';searchInput.value='';limitInput.value='100'}
    function exportCurrentResult(){const filters=getFilters();const query=buildQuery({...filters,view:viewSelect.value,limit:500});window.location.href=`/api/history/export?${query}`}
    async function refreshAll(){try{await loadStatus();await loadState();await loadOptions();await loadRecords()}catch(error){banner.innerHTML=`<span class="status-bad">\u9875\u9762\u6570\u636e\u52a0\u8f7d\u5931\u8d25\uff1a${escapeHtml(error.message)}</span>`;renderEmpty('\u9875\u9762\u6570\u636e\u52a0\u8f7d\u5931\u8d25\uff0c\u8bf7\u68c0\u67e5\u540e\u7aef\u670d\u52a1\u662f\u5426\u6b63\u5e38\u3002')}}
    refreshBtn.addEventListener('click',refreshAll);refreshStateBtn.addEventListener('click',loadState);applyBtn.addEventListener('click',loadRecords);resetBtn.addEventListener('click',async()=>{resetFilters();await loadRecords()});exportBtn.addEventListener('click',exportCurrentResult);[characterSelect,modeSelect,sessionSelect,viewSelect].forEach(el=>el.addEventListener('change',loadRecords));searchInput.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();loadRecords()}});refreshAll();
  </script>
</body>
</html>
